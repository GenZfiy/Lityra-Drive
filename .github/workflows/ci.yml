name: Lityra Hire CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check:boundary
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m compileall -q backend/services backend/libs backend/tools
      - run: python -m pytest tests -q
        working-directory: backend/services/auth
      - run: python -m pytest tests -q
        working-directory: backend/services/gateway
