[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lare-common"
version = "0.1.0"
description = "Shared library for LARE platform Flask microservices"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1.0",
    "SQLAlchemy>=2.0.36",
    "PyJWT>=2.10.1",
    "bcrypt>=4.2.1",
    "pydantic>=2.10.4",
    "python-dotenv>=1.0.1",
    "flask-cors>=5.0.0",
]

[tool.setuptools]
packages = ["lare_common"]
